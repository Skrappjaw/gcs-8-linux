# BOSS GCS-8: one stereo device per channel pair, named as in the BOSS Windows driver.
# Generated by tools/gen_hifi.py from its channel table.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "gcs8_stereo_out"
			Direction Playback
			Format FLOAT_LE
			Channels 2
			HWChannels 14
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
		}
	}
	{
		SplitPCM {
			Name "gcs8_stereo_in"
			Direction Capture
			Format FLOAT_LE
			Channels 2
			HWChannels 20
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
		}
	}
]

SectionDevice."Line1" {
	Comment "CH USB"

	Value {
		PlaybackPriority 700
	}
	Macro.pcm_split.SplitPCMDevice {
